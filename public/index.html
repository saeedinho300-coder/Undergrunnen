<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f15">
<title>Undergrunnen</title>
<script>try { const t = localStorage.getItem('ug_tema'); if (t && t !== 'midnatt') document.documentElement.dataset.tema = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Tema: T-banen om natten. Asfaltblått, signalrødt for handling, mintgrønt for «klar». */
:root{
  --bg:#0b0f15; --bg2:#0f141c; --panel:#141b25; --panel2:#19222e; --hover:#1f2a38; --line:#243041; --line2:#2e3c50;
  --text:#e8edf3; --dim:#8b98aa; --dim2:#5f6c7e;
  --signal:#c92a36; --signal2:#de4651; --signal-bg:#240f12;
  --mint:#3ee3a6; --mint-bg:#0f2a22; --gul:#ffc94d; --blaa:#5cc6ff;
  --r:10px; --r2:14px;
  --display:"Libre Baskerville",Baskerville,"Baskerville Old Face","GFS Baskerville",Georgia,serif;
  --body:"Libre Baskerville",Baskerville,"Baskerville Old Face","GFS Baskerville",Georgia,serif;
  --gull:#d6a441; --gull-mork:#6e5626;
  --navh:64px;
  --paa-signal:#fff; --kort-bg:var(--panel2);
  color-scheme:dark;
}
/* Fargetemaer (velges under Din profil → Utseende) */
:root[data-tema="noir"]{--bg:#0c0c0e;--bg2:#111113;--panel:#17171a;--panel2:#1e1e22;--hover:#26262b;--line:#29292f;--line2:#36363d;--text:#f3efe7;--dim:#a39d92;--dim2:#6d685f;--signal:#d6a441;--signal2:#ecbe5c;--signal-bg:#28200f;--paa-signal:#17120a;--mint:#82d89c;--mint-bg:#12241a;--gul:#ecbe5c;--blaa:#9cbcff}
:root[data-tema="bordeaux"]{--bg:#120a0d;--bg2:#170d11;--panel:#1f1217;--panel2:#28171e;--hover:#321d26;--line:#3a2530;--line2:#4a2f3c;--text:#f6ebe7;--dim:#b99fa6;--dim2:#7e6670;--signal:#c23b5a;--signal2:#de5a77;--signal-bg:#2e1018;--paa-signal:#fff;--mint:#8fd6b0;--mint-bg:#13261d;--gul:#e9b96c;--blaa:#a6c6ff}
:root[data-tema="smaragd"]{--bg:#06120e;--bg2:#091712;--panel:#0e1f19;--panel2:#132a21;--hover:#19352a;--line:#1d392f;--line2:#29493d;--text:#ebf4ef;--dim:#94afa3;--dim2:#5f7b6f;--signal:#d8b24b;--signal2:#ebc662;--signal-bg:#262410;--paa-signal:#14110a;--mint:#5fe1a1;--mint-bg:#0e2a1f;--gul:#ebc662;--blaa:#82c9ff}
:root[data-tema="neon"]{--bg:#0b0715;--bg2:#100a1d;--panel:#170f28;--panel2:#1e1533;--hover:#281c43;--line:#2c2148;--line2:#3b2c5f;--text:#f1edff;--dim:#a99ec9;--dim2:#706691;--signal:#ff3ea5;--signal2:#ff6dbd;--signal-bg:#2d0d22;--paa-signal:#fff;--mint:#2be8d6;--mint-bg:#0a2a2a;--gul:#ffd447;--blaa:#7fa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blaa)}
.hidden{display:none!important}
.mono,.tall{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .ok{color:var(--mint)} .bad{color:var(--signal2)} .gul{color:var(--gul)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}

/* skjema */
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:.65em .8em;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical}
label{display:block;font-size:.8rem;color:var(--dim);margin:0 0 4px}
.knapp,button.knapp{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:.65em 1.1em;background:var(--signal);color:var(--paa-signal);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.knapp:hover{background:var(--signal2)}
.knapp:disabled{opacity:.4;cursor:not-allowed}
.knapp.sek{background:var(--panel2);border:1px solid var(--line2);color:var(--text)}
.knapp.sek:hover{border-color:var(--dim)}
.knapp.mint{background:var(--mint);color:#06281c}
.knapp.liten{padding:.4em .8em;font-size:.85rem}
.knapp.full{width:100%}
.lenke{background:none;border:0;padding:0;color:var(--blaa);font-weight:600;cursor:pointer}
.rad{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rad>*{flex:1 1 140px;min-width:0}
.rad>.knapp{flex:0 0 auto}
form .felt{margin-bottom:12px}
:focus-visible{outline:2px solid var(--blaa);outline-offset:2px}

/* ======================= INNLOGGING ======================= */
.inngang{max-width:440px;margin:0 auto;padding:7vh max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.logo{text-align:center;margin-bottom:26px}
.logo .merke{display:inline-flex;align-items:center;gap:12px}
.logo h1{font-size:2.8rem;letter-spacing:.01em;text-transform:none}
.logo p{margin:6px 0 0;color:var(--dim)}
.skilt{width:44px;height:44px;border-radius:50%;background:var(--signal);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.6rem;color:#fff;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--signal)}
.boks{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.faner{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:var(--r);margin-bottom:16px}
.faner button{flex:1;border:0;background:none;padding:.55em;border-radius:8px;font-weight:600;color:var(--dim);cursor:pointer}
.faner button.aktiv{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--signal)}
.skille{display:flex;align-items:center;gap:10px;color:var(--dim2);font-size:.8rem;margin:16px 0}
.skille::before,.skille::after{content:"";flex:1;height:1px;background:var(--line)}
.googleknapp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:.7em 1em;border-radius:var(--r);background:#fff;color:#1f1f1f;font-weight:700;text-decoration:none}

/* ======================= TOPPFELT ======================= */
#spill{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg2);z-index:30}
#topp{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.topprad{display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.avatar{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem;color:#fff;border:2px solid var(--line2);text-transform:uppercase}
.avatar.liten{width:32px;height:32px;font-size:.95rem;border-width:1px}
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.stor{width:128px;height:128px;font-size:3rem;border:3px solid var(--signal)}
button.avatarknapp{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.hvem{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.hvem b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hvem>span{display:block;font-size:.82rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hvem .by{display:none}
@media (min-width:520px){.hvem .by{display:inline}}
.hvem .pst{color:var(--signal2);font-weight:700}
.botdetalj>summary{list-style:none;cursor:pointer}.botdetalj>summary::-webkit-details-marker{display:none}.botdetalj[open]>summary{background:var(--hover)}
.adminmerke{display:inline-block;vertical-align:middle;font-family:var(--body);font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;background:#2b230e;color:var(--gul);border:1px solid #6b5520}
.regelmerke{background:#2b230e;color:var(--gul);border-color:#6b5520}
.statboks{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.statboks div{display:flex;flex-direction:column;align-items:center;padding:4px 8px;min-width:0}
.statboks div+div{border-left:1px solid var(--line)}
.statboks svg{width:15px;height:15px;color:var(--dim)}
.statboks b{font-size:1.02rem;line-height:1.2;font-variant-numeric:tabular-nums}
.statboks .penger b{color:var(--mint)}
.bjelle{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line2);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.bjelle svg{width:22px;height:22px}
.prikk{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--signal);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg2)}
/* T-banelinjen som rankbar */
.linje{position:relative;height:6px;background:var(--line);cursor:pointer}
.linje i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--signal),var(--signal2));transition:width .6s ease}
.linje::after{content:"";position:absolute;right:-1px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg2);border:3px solid var(--line2)}
.utvid{display:block;margin:0 auto;border:0;background:none;color:var(--dim2);padding:2px 20px 4px;cursor:pointer}
.utvid svg{width:14px;height:14px;transition:transform .2s}
.utvid.apen svg{transform:rotate(180deg)}
.detaljer{padding:4px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.detaljer .d{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
.detaljer .d span{display:block;font-size:.68rem;letter-spacing:.01em;text-transform:none;color:var(--dim2)}
.detaljer .d b{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.detaljer .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ======================= BUNNMENY ======================= */
#bunn{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#bunn .indre{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#bunn button{position:relative;height:var(--navh);border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.01em;text-transform:none;cursor:pointer}
#bunn button svg{width:24px;height:24px}
#bunn button.aktiv{color:var(--signal2);background:linear-gradient(180deg,var(--signal-bg),transparent)}
#bunn button.aktiv::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
#bunn .dott{position:absolute;top:10px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;border:2px solid var(--bg2)}
#bunn .dott.mint{background:var(--mint)} #bunn .dott.rod{background:var(--signal)}

/* ======================= INNHOLD ======================= */
#innhold{padding:0}
.sidehode{display:flex;align-items:center;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sidehode h1{font-size:1.9rem;line-height:1}
.sidehode p{margin:3px 0 0;color:var(--dim);font-size:.88rem}
.sidehode .hoyre{margin-left:auto}
.tilbake{flex:0 0 auto;width:38px;height:38px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line2);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.tilbake svg{width:18px;height:18px}
.innside{padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.seksjon{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.seksjon>h2{font-size:.95rem;letter-spacing:.01em;text-transform:none;color:var(--signal2);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.seksjon>h2 .ekstra{margin-left:auto;color:var(--dim);letter-spacing:0;text-transform:none;font-family:var(--body);font-weight:500;font-size:.85rem}
.seksjon .kropp{padding:14px 16px}
.seksjon .kropp>p:first-child{margin-top:0}
.seksjon .kropp>p:last-child{margin-bottom:0}
.rutenett{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
.kort{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:96px;padding:13px 34px 13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);text-align:left;cursor:pointer;color:var(--text);min-width:0}
.kort:hover{background:var(--hover);border-color:var(--line2)}
.kort b{font-size:1.05rem;line-height:1.2}
.kort span{color:var(--dim);font-size:.85rem;line-height:1.3}
.kort::after{content:"";position:absolute;right:14px;top:17px;width:8px;height:8px;border-top:2px solid var(--signal2);border-right:2px solid var(--signal2);transform:rotate(45deg)}
.kort.bred{grid-column:1/-1;min-height:0}
.kort.av{opacity:.55;cursor:default}
/* Bilder (Unsplash, fri lisens). Mørk «gangster»-stil: bildet tones ned (sort-hvitt, sepia, hard kontrast),
   med vignett og et svakt rødt skjær. Feiler bildet, vises vanlig mørk bakgrunn. */
.medbilde{position:relative;overflow:hidden;isolation:isolate}
.bildelag{position:absolute;inset:0;z-index:0;background:var(--img) center/cover no-repeat;filter:grayscale(.75) sepia(.3) contrast(1.4) brightness(.5);transform:scale(1.03);transition:transform .6s ease,filter .6s ease}
.tone{position:absolute;inset:0;z-index:1;background:radial-gradient(130% 95% at 50% 25%,transparent 30%,rgba(0,0,0,.72) 100%),linear-gradient(180deg,rgba(0,0,0,0) 15%,rgba(4,4,6,.55) 55%,rgba(4,4,6,.95) 100%),linear-gradient(rgba(120,6,16,.18),rgba(120,6,16,.18))}
.medbilde>:not(.bildelag):not(.tone){position:relative;z-index:2}
.kort.medbilde{justify-content:flex-end;min-height:132px;border-color:#2a2a30;background:#0c0c0e}
.kort.medbilde::after{z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.kort.medbilde:hover .bildelag{transform:scale(1.09);filter:grayscale(.6) sepia(.3) contrast(1.4) brightness(.62)}
.kort.medbilde b{color:#fff;font-size:1.15rem;letter-spacing:.01em;text-shadow:0 2px 6px rgba(0,0,0,.95)}
.kort.medbilde span{color:#d9d4cc;text-shadow:0 1px 4px rgba(0,0,0,.95)}
.kort.medbilde span.merke{text-shadow:none}
.kort.medbilde.bred{min-height:128px}
.panelhode.medbilde{min-height:136px;border-bottom-color:#2a2a30;background:#0c0c0e}
.panelhode.medbilde h1{color:#fff;font-size:2rem;text-shadow:0 2px 8px rgba(0,0,0,.95)}
.panelhode.medbilde .over{color:#c9c2b8}
.panelhode.medbilde .status{text-shadow:0 1px 6px rgba(0,0,0,.95)}
.hubbilde{height:120px;margin:12px 12px 0;border-radius:var(--r2);border:1px solid #2a2a30;background:#0c0c0e}
/* Eiendom */
.boligliste{display:grid;gap:12px;padding:12px}
.boligkort{display:flex;align-items:flex-end;min-height:220px;border-radius:var(--r2);border:1px solid #2a2a30;background:#0c0c0e}
.boligkort.stor{min-height:240px}
.boligkort.min{border-color:var(--gull-mork);box-shadow:0 0 0 1px var(--gull-mork)}
.boliginfo{padding:14px 16px;width:100%}
.boliginfo h3{font-family:var(--display);font-size:1.45rem;color:#fff;margin:4px 0 2px;text-shadow:0 2px 6px rgba(0,0,0,.95)}
.boliginfo p{margin:0;color:#d9d4cc;font-size:.92rem;text-shadow:0 1px 4px rgba(0,0,0,.95)}
.boliginfo .over{font-style:italic;color:var(--gull)}
.prislapper{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.prislapp{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:.95rem}
.prislapp em{font-weight:400;font-size:.78rem;color:#c9c2b8}
.prislapp small{font-weight:400;font-size:.75rem;color:#c9c2b8}
.prislapp.gull{border-color:var(--gull-mork);color:var(--gull)}
.gullknapp{background:var(--gull);color:#17120a}.gullknapp:hover{background:#ecbe5c}
@media (min-width:640px){.boligliste{grid-template-columns:repeat(2,minmax(0,1fr))}}
#bunn .indre[style*="repeat(6"] button{font-size:.68rem}
#bunn .indre[style*="repeat(6"] button svg{width:22px;height:22px}
/* Resultatbilde etter en handling */
.resultat{display:flex;align-items:flex-end;min-height:150px;margin:0 0 12px;border-radius:var(--r2);border:1px solid #2a2a30;background:#0c0c0e;animation:resInn .45s ease}
.resultat .rtekst{padding:14px 16px}
.resultat small{display:block;font-weight:700;font-size:.8rem;letter-spacing:.06em;color:#c9c2b8}
.resultat b{display:block;color:#fff;font-size:1.05rem;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.95)}
.resultat.ok{border-color:#1f5a44}.resultat.ok small{color:var(--mint)}
.resultat.fengsel{border-color:#6a1d26}.resultat.fengsel small{color:#ff6b75}
.resultat.feil small{color:var(--gul)}
.resultat.ok .tone{background:radial-gradient(130% 95% at 50% 25%,transparent 30%,rgba(0,0,0,.72) 100%),linear-gradient(180deg,rgba(0,0,0,0) 15%,rgba(4,4,6,.95) 100%),linear-gradient(rgba(10,90,60,.16),rgba(10,90,60,.16))}
.resultat.fengsel .bildelag{filter:grayscale(.2) contrast(1.35) brightness(.55)}
.resultat.medbilde>.lukk{position:absolute;top:8px;right:8px;z-index:3;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;cursor:pointer;font-size:1rem;line-height:1}
@keyframes resInn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.resultat{animation:none}.bildelag{transition:none}}
@media (min-width:640px){.kort.medbilde{min-height:150px}.hubbilde{height:170px}.panelhode.medbilde{min-height:170px}.resultat{min-height:190px}}
.kort.av::after{display:none}
.merke{display:inline-block;align-self:flex-start;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.04em;background:var(--signal-bg);color:var(--signal2);border:1px solid #4a2128}
.merke.mint{background:var(--mint-bg);color:var(--mint);border-color:#1d4a3b}
.merke.gul{background:#2b230e;color:var(--gul);border-color:#4d3f17}

/* lister og tabeller */
.liste{display:flex;flex-direction:column}
.linjeel{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.linjeel:first-child{border-top:0}
.linjeel .info{flex:1;min-width:0}
.linjeel .info b{display:block;overflow:hidden;text-overflow:ellipsis}
.linjeel .info small{display:block;color:var(--dim);font-size:.82rem}
.linjeel .sjanse{color:var(--dim);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.linjeel.laast{opacity:.45}
.spill{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--signal);color:var(--paa-signal);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 3px var(--signal-bg)}
.spill:hover{background:var(--signal2)}
.spill:disabled{background:var(--line2);box-shadow:none;cursor:not-allowed}
.spill svg{width:16px;height:16px;margin-left:2px}
.ventevrapper{position:relative;display:inline-flex;flex:0 0 auto}
.ventetid{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--gul);pointer-events:none;font-variant-numeric:tabular-nums}
.ventevrapper .spill:disabled svg{opacity:0}
.ventevrapper .ventetid:empty{display:none}
.ranknapp:disabled{color:transparent;background:var(--panel2);border:1px solid var(--line2)}
.ranknapp{width:100%;min-height:64px;font-size:1.15rem;font-family:var(--display);letter-spacing:.06em}
.aksje{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.aksje:first-child{border-top:0}
.aksjetopp{display:flex;gap:12px;align-items:flex-start}
.aksjetopp .info{flex:1;min-width:0}
.aksjetopp .info small{display:block}
.spark{width:100%;height:34px;display:block}
.tabell{width:100%;border-collapse:collapse}
.tabell th{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.01em;text-transform:none;color:var(--dim2);text-align:left;padding:10px 16px 6px}
.tabell td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tabell .tall,.tabell td.h{text-align:right}
.tabell tr.meg td{background:var(--hover)}
.tom{color:var(--dim);padding:18px 16px;text-align:center}
.bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal)}
.bar.mint i{background:var(--mint)}
.nokkeltall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nokkeltall div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.nokkeltall span{display:block;font-size:.7rem;letter-spacing:.01em;text-transform:none;color:var(--dim2)}
.nokkeltall b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);border:1px solid #4a2128;background:var(--signal-bg)}
.banner.gul{border-color:#4d3f17;background:#221c0c}
.banner.mint{border-color:#1d4a3b;background:var(--mint-bg)}
.banner .knapp{margin-left:auto}
.pre{white-space:pre-wrap;font-variant-numeric:tabular-nums;color:var(--dim);font-size:.88rem;margin:6px 0 0}

/* ======================= HANDLINGER: ikonrad ======================= */
.handlinger{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:calc(100vh - 220px)}
.skinne{border-right:1px solid #26221c;background:#0c0c0e;padding:4px 0;display:flex;flex-direction:column}
/* Gullkant: navn i Baskerville, status i kursiv, tynn gullstripe til venstre som fylles mens du venter */
.stopp{position:relative;width:100%;border:0;border-bottom:1px solid #1d1a16;background:none;padding:13px 8px 12px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;cursor:pointer;color:#a39d92;text-align:left}
.stopp:hover{background:#141210}
.stopp b{font-family:var(--display);font-weight:400;font-size:1rem;letter-spacing:.01em;text-transform:none;color:#efe6d6;line-height:1.1}
.stopp.aktiv{background:linear-gradient(90deg,#2a2213,rgba(42,34,19,0))}
.stopp.aktiv b{color:var(--gull);font-weight:700}
.stopp small{font-family:var(--body);font-style:italic;font-size:.78rem;font-weight:400;color:var(--gull);font-variant-numeric:tabular-nums;line-height:1}
.stopp small.vent{color:#a39d92}
.stopp small.inne{color:var(--signal2)}
.framdrift{position:absolute;left:0;top:0;bottom:0;width:3px;background:#221d15;overflow:hidden}
.framdrift i{position:absolute;left:0;right:0;bottom:0;display:block;transition:height .9s linear}
.panel{min-width:0}
.panelhode{display:flex;align-items:flex-end;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.panelhode .over{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.01em;color:var(--dim2);text-transform:none}
.panelhode h1{font-size:1.75rem;line-height:1.05}
.panelhode .status{margin-left:auto;font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--mint);font-variant-numeric:tabular-nums}
.panelhode .status.vent{color:var(--gul)}
.panel .innside{padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}

/* blackjack-kort */
.hand{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.spillkort{width:46px;height:64px;border-radius:7px;background:#f4f1ea;color:#16181c;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.spillkort.rod{color:#c8263a}
.spillkort .s{align-self:flex-end;font-size:1.1rem;line-height:1}

.terningbord{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center;margin:4px 0 6px}
.terningbord .mot{font-family:var(--display);color:var(--dim2);font-size:1.1rem}
.terninger{display:flex;gap:8px;margin-top:4px}
.terning{width:52px;height:52px;border-radius:10px;background:#f4f1ea;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.terning i{display:block;margin:auto;width:9px;height:9px;border-radius:50%}
.terning i.p{background:#16181c}
#bankT .terning{background:var(--signal)} #bankT .terning i.p{background:#fff}

/* chat og forum */
.chatlogg{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.chatlogg .m{display:flex;gap:8px;align-items:flex-start;word-break:break-word}
.chatlogg .m small{color:var(--dim2);font-size:.75rem;margin-left:6px}
.chatlogg .sys{color:var(--signal2);font-style:italic;font-size:.9rem}
.innlegg{padding:12px 16px;border-top:1px solid var(--line)}
.innlegg:first-child{border-top:0}
.innlegg .hode{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.innlegg .tekst{white-space:pre-wrap;word-break:break-word}
.melding.ulest .info b{color:var(--gul)}
.loggikon{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--dim2);align-self:flex-start;margin-top:6px}
.loggikon.ok{background:var(--mint)} .loggikon.bad{background:var(--signal)} .loggikon.hendelse{background:var(--gul);box-shadow:0 0 0 3px #3a3010}
.loggrad.ny{background:#1d1a10}
.meldingkropp{white-space:pre-wrap;padding:0 16px 14px;color:var(--text)}


/* temavalg */
.temavalg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:12px}
.temavalg button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-weight:600;cursor:pointer}

.prover{display:flex;gap:4px}
.prover i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
/* profil */
.profiltopp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px 0 4px}
.profiltopp h2{font-size:1.8rem;margin-top:6px}
.merker{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.linjeel.pil{position:relative;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--text);text-align:left;cursor:pointer;padding-right:36px}
.liste>.linjeel.pil:first-child{border-top:0}
.linjeel.pil::after{content:"";position:absolute;right:18px;top:50%;margin-top:-4px;width:8px;height:8px;border-top:2px solid var(--signal2);border-right:2px solid var(--signal2);transform:rotate(45deg)}
button.linjeel{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--text);text-align:left;cursor:pointer}
.bryter{cursor:pointer;position:relative}
.bryter input{position:absolute;opacity:0;pointer-events:none}
.bryter .spor{flex:0 0 auto;width:50px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:background .2s}
.bryter .spor::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.bryter input:checked+.spor{background:var(--signal)}
.bryter input:checked+.spor::after{transform:translateX(22px)}
.bryter input:focus-visible+.spor{outline:2px solid var(--blaa);outline-offset:2px}
.rad-bryter{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.avatarrad{display:flex;gap:16px;align-items:center}
.avatarrad .avatar.stor{width:96px;height:96px;font-size:2.2rem}
.valg{display:flex;gap:8px;flex-wrap:wrap}
.valg button{flex:1 1 90px;padding:.6em;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg2);color:var(--dim);font-weight:600;cursor:pointer}
.valg button.aktiv{border-color:var(--signal);color:var(--signal2);background:var(--signal-bg)}
.verktoy{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 8px}
.verktoy button{width:40px;height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:1rem;cursor:pointer;display:grid;place-items:center}
.verktoy button:hover{border-color:var(--dim)}
.fargeprikk{display:block;width:16px;height:16px;border-radius:50%;background:#c92a36}
.biotekst{display:block;width:calc(100% - 32px);margin:0 16px;font-family:ui-monospace,Menlo,monospace;font-size:.88rem}
.forhand{margin:12px 16px 16px;padding:12px;border:1px dashed var(--line2);border-radius:var(--r);background:var(--bg2)}
.bb{line-height:1.6;word-break:break-word}
.bb img{max-width:100%;border-radius:8px}
.bb blockquote{margin:10px 0;padding:10px 14px;border:1px solid var(--line2);border-left:3px solid var(--signal);border-radius:8px;background:var(--bg2)}
.bb code{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);padding:1px 5px;border-radius:4px}
.bb hr{border:0;border-top:1px solid var(--line2);margin:14px 0}
.bb ul{margin:6px 0;padding-left:22px}
.bb a{color:var(--blaa)}
.bb-s1{font-size:.75em}.bb-s2{font-size:.9em}.bb-s3{font-size:1.1em}.bb-s4{font-size:1.4em}.bb-s5{font-size:2em;font-family:var(--display);line-height:1.1}.bb-s6{font-size:2.8em;font-family:var(--display);line-height:1}
.skjold{flex:0 0 auto;width:52px;height:58px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--gul);background:#2b230e;border:2px solid var(--gul);border-radius:10px 10px 26px 26px;font-size:.95rem}

/* modal og varsel */
#varsel{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(560px,calc(100vw - 32px));z-index:40;padding:12px 16px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.6);font-weight:500}
#varsel.ok{border-color:var(--mint);box-shadow:0 10px 40px rgba(0,0,0,.6),inset 3px 0 0 var(--mint)}
#varsel.bad{border-color:var(--signal);box-shadow:0 10px 40px rgba(0,0,0,.6),inset 3px 0 0 var(--signal)}
.modal{position:fixed;inset:0;background:rgba(3,6,10,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .boks{width:100%;max-width:400px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:640px){
  .rutenett{grid-template-columns:repeat(2,minmax(0,1fr))}
  .handlinger{grid-template-columns:120px minmax(0,1fr)}
  .nokkeltall{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:440px){
  .topp .avatar,.topprad>.avatar{width:40px;height:40px;font-size:1.05rem}
  .bjelle{width:42px;height:42px}
  .statboks div{padding:4px 6px}
  .statboks b{font-size:.95rem}
  .hvem b{font-size:1.15rem}
}
</style>

<script type="module">
// =====================================================================
//  VERKTØY
// =====================================================================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = (n) => Number(n || 0).toLocaleString('nb-NO') + ' kr';
const tall = (n) => Number(n || 0).toLocaleString('nb-NO');
const kort = (n) => { n = Number(n || 0); const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace('.', ',') + 'mrd';
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + 'm';
  if (a >= 1e4) return Math.floor(n / 1e3) + 'k';
  return tall(n); };
const kompakt = (n) => { n = Number(n || 0); return Math.abs(n) >= 1000 && Math.abs(n) < 1e6 ? (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace('.', ',').replace(',0', '') + 'k' : kort(n); };
const dato = (iso) => new Date(iso).toLocaleString('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const arg = (o) => esc(JSON.stringify(o));

let data = null, st = null, offset = 0;
const naa = () => Date.now() + offset;
const sekIgjen = (iso) => iso ? Math.max(0, Math.ceil((new Date(iso).getTime() - naa()) / 1000)) : 0;
const tid = (s) => s >= 3600 ? `${Math.floor(s / 3600)}t ${Math.floor(s % 3600 / 60)}m` : s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s}s`;
const tidKort = (s) => s >= 3600 ? `${Math.ceil(s / 3600)}t` : s >= 60 ? `${Math.ceil(s / 60)}m` : `${s}s`;
const fengslet = () => st?.spiller && sekIgjen(st.spiller.fengsel_til) > 0;

function fargeFra(navn) { let h = 0; for (const c of String(navn)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 45% 34%)`; }
let bildeKart = {};
async function hentBilder() { try { bildeKart = (await rpc('bilde_liste')) || {}; } catch {} }
const avatar = (navn, liten, stor, eksplisitt) => {
  const url = eksplisitt !== undefined ? eksplisitt : bildeKart[navn], kl = `avatar${liten ? ' liten' : ''}${stor ? ' stor' : ''}`;
  if (url) return `<span class="${kl}" style="background:${fargeFra(navn)}"><img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></span>`;
  return `<span class="${kl}" style="background:${fargeFra(navn)}">${esc(String(navn).slice(0, 2))}</span>`;
};
const lagre = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const hent = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

// =====================================================================

// =====================================================================
const S = (d, ekstra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${ekstra}>${d}</svg>`;
const IK = {
  handlinger: S('<path d="M7 11V7a2 2 0 1 1 4 0v3"/><path d="M11 9V5.5a2 2 0 1 1 4 0V10"/><path d="M15 9.5a2 2 0 1 1 4 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3.5 15a1.8 1.8 0 0 1 3-2l.5.7V11"/>'),
  handel: S('<circle cx="9" cy="9" r="5.5"/><path d="M14.5 6.6A5.5 5.5 0 1 1 9.6 15"/><path d="M9 6.5v5M7.4 8h2.4a1 1 0 0 1 0 2H8.2a1 1 0 0 0 0 2h2.4"/>'),
  sosial: S('<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/>'),
  casino: S('<rect x="3" y="3" width="12" height="12" rx="2.5"/><circle cx="6.5" cy="6.5" r=".9" fill="currentColor"/><circle cx="11.5" cy="11.5" r=".9" fill="currentColor"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><path d="M15 9h3.5A2.5 2.5 0 0 1 21 11.5v7a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 9 18.5V15"/><circle cx="15" cy="18" r=".9" fill="currentColor"/>'),
  oppdrag: S('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'),
  eiendom: S('<path d="M3 11 12 4l9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>'),
  bjelle: S('<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  penger: S('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),

class IkkeInnlogget extends Error {}
async function post(sti, body = {}) {
  let r;
  try { r = await fetch('/api/' + sti, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' }); }
  catch { throw new Error('Ingen kontakt med serveren. Sjekk nettet.'); }
  let d = {};
  try { d = await r.json(); } catch {}
  if (r.status === 401 && sti === 'rpc') throw new IkkeInnlogget(d.error || 'Du er ikke innlogget');
  if (!r.ok) throw new Error(vennlig(d.error || 'Noe gikk galt. Prøv igjen.'));
  return d;
}
// Gjør ventemeldinger lettere å lese: «Du må vente 226 sekunder» → «Du må vente 3:46»
function vennlig(m) {
  return String(m).replace(/(\d+) sekunder/g, (x, n) => tid(Number(n))).replace(/^Failed query:.*$/s, 'Noe gikk galt. Prøv igjen om litt.');
}
const rpc = async (fn, args = {}) => (await post('rpc', { fn, args })).data;

let varselTimer;
function varsel(tekst, type = 'ok') {
  const v = $('#varsel');
  v.className = type; v.textContent = tekst;
  clearTimeout(varselTimer);
  varselTimer = setTimeout(() => v.classList.add('hidden'), Math.min(9000, 3500 + tekst.length * 40));
}

async function handling(fn, args) {
  try {
    const r = await rpc(fn, args);
    huskResultat(fn, r);
    if (r && r.melding) varsel(r.melding, r.ok || r.uavgjort ? 'ok' : 'bad');
    if (r && r.rankopp) setTimeout(() => varsel(`Gratulerer! Du er nå ${r.rankopp}.`, 'ok'), 2200);
    await oppdater();
    if (fn === 'slett_traad') gaa('forum'); else await tegnSide(true);
    return r;
  } catch (e) {
    if (e instanceof IkkeInnlogget) return tilInnlogging();
    varsel(e.message, 'bad');
    await oppdater().catch(() => {});
  }
}

let pollTimer = null, sideTimer = null, starter = false, forrigeRank = null;
async function start() {
  if (starter) return; starter = true;
  try {
    if (!data) data = await rpc('spill_data');
    await hentBilder();
    await oppdater();
    if (!st.spiller) { visLag(); return; }
    vis('spill');
    clearInterval(pollTimer);
    let runder = 0;
    pollTimer = setInterval(() => { if (++runder % 6 === 0) hentBilder(); oppdater().catch(e => { if (e instanceof IkkeInnlogget) tilInnlogging(); }); }, 20000);
    await tegnSide();
  } catch (e) { if (e instanceof IkkeInnlogget) tilInnlogging(); else varsel(e.message, 'bad'); }
  finally { starter = false; }
}
function stopp() { clearInterval(pollTimer); clearInterval(sideTimer); st = null; forrigeRank = null; }

function rankProsent() {
  if (!st?.neste_exp) return 100;
  return Math.max(0, Math.min(99, Math.floor(((st.spiller.exp - st.rank_exp) / (st.neste_exp - st.rank_exp)) * 100)));
}
async function oppdater() {
  st = await rpc('min_status');
  offset = new Date(st.tid).getTime() - Date.now();
  if (!st.spiller) { if (!$('#spill').classList.contains('hidden')) { clearInterval(pollTimer); visLag(); } return; }
  if (forrigeRank !== null && st.rank_indeks > forrigeRank) setTimeout(() => varsel(`Gratulerer! Du er nå ${st.rank}.`, 'ok'), 1800);
  forrigeRank = st.rank_indeks;
  tegnTopp(); tegnBunn();
}

    if (nr !== tegner) return;
    const y = window.scrollY; main.innerHTML = html; if (stille) window.scrollTo(0, y);

    if (e instanceof IkkeInnlogget) return tilInnlogging();
    main.innerHTML = `<div class="innside"><p class="bad">${esc(e.message)}</p></div>`;
  }
}

function ringStil(felt, total) {
  const s = felt ? sekIgjen(st.spiller[felt]) : 0;
  if (!s) return { p: 1, f: 'var(--mint)', tekst: '✓', vent: false };
  return { p: Math.max(.04, 1 - s / Math.max(total, s)), f: 'var(--gul)', tekst: tidKort(s), vent: true };

function sparkline(verdier, bredde = 300, hoyde = 34) {
  if (!verdier?.length) return '';
  const min = Math.min(...verdier), max = Math.max(...verdier), sp = max - min || 1;
  const pkt = verdier.map((v, i) => `${(i / (verdier.length - 1) * bredde).toFixed(1)},${(hoyde - 3 - (v - min) / sp * (hoyde - 6)).toFixed(1)}`).join(' ');
  const opp = verdier[verdier.length - 1] >= verdier[0];
  return `<svg class="spark" viewBox="0 0 ${bredde} ${hoyde}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pkt}" fill="none" stroke="${opp ? 'var(--mint)' : 'var(--signal2)'}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

  // ------------------------------------------------ EIENDOM
  eiendom: { fane: 'eiendom', tittel: 'Eiendom', async vis() {
    const e = await rpc('eiendom_info'), naa = e.boliger.find(b => b.id === e.bolig) || e.boliger[0];
    const status = e.bolig === 'uteligger' ? 'Du bor på gata. Det er gratis.' : e.eid ? 'Du eier denne boligen.' : `Leid. Leien går ut om <b data-til="${e.leie_til}"></b>.`;
    const leieTekst = (b) => b.leie === 0 ? 'Gratis' : `${kr(b.leie)} <small>/ 30 dager</small>`;
    const kortB = (b) => {
      const min = b.id === e.bolig, forlenge = min && !e.eid && b.leie;
      const knapper = [];
      if (b.leie !== null && !e.eid && (!min || forlenge) && !(b.id === 'uteligger' && min)) knapper.push(`<button class="knapp ${b.leie ? '' : 'sek'} liten" data-act="lei_bolig" data-args='${arg({ p_id: b.id })}' ${!e.eid && e.bolig !== 'uteligger' && !min && b.leie ? `data-bekreft="Du mister resten av leien du har nå. Vil du flytte?"` : ''}>${b.id === 'uteligger' ? 'Flytt ut' : forlenge ? 'Forleng 30 dager' : 'Lei'}</button>`);
      if (b.kjop !== null && !e.eid) knapper.push(`<button class="knapp liten gullknapp" data-act="kjop_bolig" data-args='${arg({ p_id: b.id })}' data-bekreft="Kjøpe ${esc(b.navn.toLowerCase())} for ${kr(b.kjop)}? Kontanter brukes først, resten tas fra banken.">Kjøp</button>`);
      if (min && e.eid) knapper.push(`<button class="knapp sek liten" data-act="selg_bolig" data-args='{}' data-bekreft="Selge ${esc(b.navn.toLowerCase())} for ${kr(Math.floor(b.kjop * 0.8))} (80 %)?">Selg for ${kr(Math.floor(b.kjop * 0.8))}</button>`);
      return `<div class="boligkort medbilde ${min ? 'min' : ''}" ${bildeStil('bolig_' + b.id, 800)}>${LAG}
        <div class="boliginfo">${min ? '<span class="merke gul">Din bolig</span>' : b.leie === null ? '<span class="merke">Kun til salgs</span>' : ''}<h3>${esc(b.navn)}</h3><p>${esc(b.beskrivelse)}</p>
        <div class="prislapper">${b.leie !== null ? `<span class="prislapp"><em>Leie</em>${leieTekst(b)}</span>` : ''}${b.kjop !== null ? `<span class="prislapp gull"><em>Kjøp</em>${kr(b.kjop)}</span>` : ''}</div>
        ${knapper.length ? `<div class="rad" style="gap:8px;margin-top:10px">${knapper.join('')}</div>` : ''}</div></div>`;
    };
    return `<div class="boligkort stor medbilde min" ${bildeStil('bolig_' + naa.id, 1000)}>${LAG}<div class="boliginfo"><small class="over">Du bor nå</small><h3>${esc(naa.navn)}</h3><p>${status}</p></div></div>`
      + `<div class="nokkeltall" style="margin:12px 0"><div><span>Kontanter</span><b class="ok">${kr(e.penger)}</b></div><div><span>I banken</span><b>${kr(e.bank)}</b></div></div>`
      + seksjon('Leie eller kjøpe', `<div class="boligliste">${e.boliger.filter(b => b.leie !== null).map(kortB).join('')}</div>`, 'Leie varer 30 dager')

// ---------- BBCode (trygg: teksten escapes først, bare kjente koder blir HTML) ----------
function bbkode(tekst) {
  if (!tekst) return '';
  let h = esc(tekst);
  const URL_OK = 'https?:\\/\\/[^\\s\\[\\]"<>]+';
  for (let i = 0; i < 6; i++) {
    const for_ = h;
    h = h.replace(/\[(b|i|u|s)\]([\s\S]*?)\[\/\1\]/gi, (m, t, inn) => `<${{ b: 'strong', i: 'em', u: 'u', s: 's' }[t.toLowerCase()]}>${inn}</${{ b: 'strong', i: 'em', u: 'u', s: 's' }[t.toLowerCase()]}>`)
      .replace(/\[color=(#[0-9a-f]{3,6}|[a-z]{3,20})\]([\s\S]*?)\[\/color\]/gi, '<span style="color:$1">$2</span>')
      .replace(/\[size=([1-6])\]([\s\S]*?)\[\/size\]/gi, '<span class="bb-s$1">$2</span>')
      .replace(/\[(center|left|right)\]([\s\S]*?)\[\/\1\]/gi, '<div style="text-align:$1">$2</div>')
      .replace(/\[quote(?:=([^\]]{1,40}))?\]([\s\S]*?)\[\/quote\]/gi, (m, n, inn) => `<blockquote>${n ? `<b>${n}:</b><br>` : ''}${inn}</blockquote>`)
      .replace(/\[code\]([\s\S]*?)\[\/code\]/gi, '<code>$1</code>')
      .replace(/\[list\]([\s\S]*?)\[\/list\]/gi, (m, inn) => '<ul>' + inn.split('[*]').map(x => x.trim()).filter(Boolean).map(x => `<li>${x}</li>`).join('') + '</ul>');
    if (h === for_) break;
  }
  h = h.replace(new RegExp(`\\[url=(${URL_OK})\\]([\\s\\S]*?)\\[\\/url\\]`, 'gi'), '<a href="$1" target="_blank" rel="noopener noreferrer nofollow">$2</a>')
    .replace(new RegExp(`\\[url\\](${URL_OK})\\[\\/url\\]`, 'gi'), '<a href="$1" target="_blank" rel="noopener noreferrer nofollow">$1</a>')
    .replace(new RegExp(`\\[img\\](${URL_OK})\\[\\/img\\]`, 'gi'), '<img src="$1" alt="" loading="lazy" referrerpolicy="no-referrer">')
    .replace(/\[hr\]/gi, '<hr>');
  return h.replace(/\n/g, '<br>').replace(/<br>\s*(<\/?(ul|li|div|blockquote|hr)[^>]*>)/g, '$1').replace(/(<\/?(ul|li|div|blockquote)[^>]*>)\s*<br>/g, '$1');
}
function musikk(url) {
  if (!url) return '';
  if (/\.(mp3|ogg|wav|m4a)(\?|$)/i.test(url)) return `<audio controls preload="none" src="${esc(url)}" style="width:100%"></audio>`;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,15})/);
  if (yt) return `<a class="knapp sek full" href="https://www.youtube.com/watch?v=${yt[1]}" target="_blank" rel="noopener noreferrer">▶ Spill musikken på YouTube</a>`;
  return `<a class="knapp sek full" href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow">▶ Åpne musikken</a>`;
}
