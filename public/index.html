<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undergrunnen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0c0b; --panel:#171513; --panel2:#1f1c19; --line:#2e2a25;
  --text:#e9e4dc; --dim:#9a9187; --red:#c3262e; --red2:#e0434b;
  --gold:#d6a84a; --green:#5fae6a; --radius:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
body{background:radial-gradient(ellipse at top,#1d1512 0%,var(--bg) 60%) fixed}
a{color:var(--gold)}
h1,h2,h3{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.04em;font-weight:400;margin:0 0 .4em}
h1{font-size:2.6rem;color:var(--red2)} h2{font-size:1.9rem} h3{font-size:1.3rem;color:var(--gold)}
.mono{font-family:"IBM Plex Mono",monospace}
.dim{color:var(--dim)} .ok{color:var(--green)} .bad{color:var(--red2)} .gold{color:var(--gold)}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#0f0e0d;border:1px solid var(--line);border-radius:var(--radius);padding:.55em .7em;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:transparent}
button{background:var(--red);border:0;border-radius:var(--radius);padding:.55em 1em;font-weight:600;cursor:pointer;white-space:nowrap}
button:hover{background:var(--red2)} button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.ghost:hover{border-color:var(--gold)}
button.small{padding:.3em .7em;font-size:.85rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.item .info{min-width:0;flex:1}
.item .info b{display:block}
.item small{color:var(--dim)}
.locked{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat span{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.stat b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.bar{height:6px;background:#0f0e0d;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.link{background:none;padding:0;color:var(--gold);font-weight:500}
.link:hover{background:none;text-decoration:underline}

/* innlogging */
#auth,#lag{max-width:400px;margin:8vh auto;padding:0 16px}
.logo{text-align:center;margin-bottom:24px}
.logo p{margin:0;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
form .felt{margin-bottom:10px}
label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:3px}

/* spill */
#spill{display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1;background:#0a0908ee;border-bottom:1px solid var(--line);padding:10px 18px;position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.topp{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.topp .navn{font-family:"Bebas Neue";font-size:1.6rem;line-height:1;color:var(--red2)}
.topp .pill{font-size:.85rem;white-space:nowrap}
.topp .pill span{color:var(--dim);margin-right:4px}
.topp .loggut{margin-left:auto}
.timere{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.timer{font-size:.75rem;border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--dim)}
.timer.klar{color:var(--green);border-color:#2f4a33}
nav{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:96px;align-self:start}
nav button{display:flex;justify-content:space-between;width:100%;background:none;text-align:left;font-weight:500;color:var(--dim);padding:.5em .8em;margin-bottom:2px}
nav button:hover{background:var(--panel);color:var(--text)}
nav button.aktiv{background:var(--panel);color:var(--text);box-shadow:inset 3px 0 0 var(--red)}
nav .badge{background:var(--red);color:#fff;border-radius:10px;font-size:.7rem;padding:0 6px}
main{padding:18px;max-width:860px;width:100%}
#varsel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,92vw);z-index:20;padding:12px 16px;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--line);box-shadow:0 8px 30px #000a}
#varsel.ok{border-color:var(--green)} #varsel.bad{border-color:var(--red)}
.fengselbanner{background:#2a1214;border:1px solid var(--red);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.chatlogg{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;background:#0f0e0d;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.chatlogg div{word-wrap:break-word}
.chatlogg .t{color:var(--dim);font-size:.75rem;margin-right:6px}
.melding .kropp{white-space:pre-wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.melding.ulest b{color:var(--gold)}
.rulett-tall{font-family:"Bebas Neue";font-size:3.2rem;text-align:center;line-height:1}
.skille{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.8rem;margin:14px 0}
.skille::before,.skille::after{content:"";flex:1;height:1px;background:var(--line)}
.googleknapp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:.6em 1em;border-radius:var(--radius);background:#fff;color:#1f1f1f;font-weight:600;text-decoration:none}
.googleknapp:hover{background:#f1f1f1}
.rankbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);font-weight:500;text-align:left}
.rankbar:hover{background:var(--panel2);border-color:var(--gold)}
.rb-navn{font-family:"Bebas Neue",Impact,sans-serif;font-size:1.15rem;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
.rb-spor{flex:1;height:8px;background:#0f0e0d;border-radius:4px;overflow:hidden;min-width:60px}
.rb-spor i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s ease}
.rb-pst{font-size:.85rem;white-space:nowrap}
.rb-neste{font-size:.8rem;color:var(--dim);white-space:nowrap}
tr.denne td{background:var(--panel2)}
@media (max-width:420px){.rb-neste{display:none}}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .card{max-width:380px;width:100%}

@media (max-width:760px){
  #spill{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  header{padding:8px 12px;position:static}
  .topp{gap:10px}
  .topp .navn{font-size:1.35rem}
  nav{position:sticky;top:0;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:4;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{width:auto;flex:0 0 auto;margin:0;gap:6px}
  nav button.aktiv{box-shadow:inset 0 -2px 0 var(--red)}
  main{padding:12px}
}
</style>
</head>
<body>

<!-- ============ INNLOGGING ============ -->
<section id="auth" class="hidden">
  <div class="logo"><h1>Undergrunnen</h1><p>Byen sover. Du gjør det ikke.</p></div>
  <div class="card">
    <div class="tabs">
      <button type="button" id="tabLogg">Logg inn</button>
      <button type="button" id="tabReg" class="ghost">Ny bruker</button>
    </div>
    <form id="authForm">
      <div class="felt"><label for="epost">Brukernavn eller e-post</label><input id="epost" name="epost" type="text" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="f.eks. zaid eller navn@epost.no"></div>
      <div class="felt"><label>Passord</label><input name="passord" type="password" required minlength="6" autocomplete="current-password"></div>
      <button style="width:100%" id="authKnapp">Logg inn</button>
      <p id="authFeil" class="bad"></p>
    </form>
    <div id="googleBoks" class="hidden">
      <div class="skille"><span>eller</span></div>
      <a class="googleknapp" href="/api/google/start">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Fortsett med Google
      </a>
    </div>
  </div>
</section>

<!-- ============ LAG KARAKTER ============ -->
<section id="lag" class="hidden">
  <div class="logo"><h1>Undergrunnen</h1></div>
  <div class="card">
    <div id="dodTekst"></div>
    <h2>Velg ditt gangsternavn</h2>
    <form id="lagForm">
      <div class="felt"><input name="navn" required maxlength="16" placeholder="3–16 tegn"></div>
      <button style="width:100%">Start i Oslo</button>
      <p id="lagFeil" class="bad"></p>
    </form>
    <button class="ghost small" data-loggut>Logg ut</button>
  </div>
</section>

<!-- ============ SPILLET ============ -->
<section id="spill" class="hidden">
  <header id="topp"></header>
  <nav id="meny"></nav>
  <main id="side"></main>
</section>

<div id="varsel" class="hidden"></div>
<div id="modal" class="modal hidden"></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = (n) => Number(n || 0).toLocaleString('nb-NO') + ' kr';
const tall = (n) => Number(n || 0).toLocaleString('nb-NO');

let data = null;       // spilldata (kriminalitet, våpen osv.)
let st = null;         // egen status
let offset = 0;        // serverklokke minus klientklokke
let side = 'oversikt';
let chatTimer = null;
let sisteChatId = 0;
let pollTimer = null;

const naa = () => Date.now() + offset;
const sekIgjen = (iso) => iso ? Math.max(0, Math.ceil((new Date(iso).getTime() - naa()) / 1000)) : 0;
const tid = (s) => s >= 3600 ? `${Math.floor(s/3600)}t ${Math.floor(s%3600/60)}m` : s >= 60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : `${s}s`;
const fengslet = () => st?.spiller && sekIgjen(st.spiller.fengsel_til) > 0;

class IkkeInnlogget extends Error {}
async function post(sti, body = {}) {
  let r;
  try {
    r = await fetch('/api/' + sti, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
  } catch { throw new Error('Ingen kontakt med serveren. Sjekk nettet.'); }
  let d = {};
  try { d = await r.json(); } catch { /* ikke json */ }
  if (r.status === 401 && sti === 'rpc') throw new IkkeInnlogget(d.error || 'Du er ikke innlogget');
  if (!r.ok) throw new Error(d.error || 'Noe gikk galt. Prøv igjen.');
  return d;
}
async function rpc(fn, args = {}) {
  return (await post('rpc', { fn, args })).data;
}

let varselTimer;
function varsel(tekst, type = 'ok') {
  const v = $('#varsel');
  v.className = type; v.textContent = tekst;
  clearTimeout(varselTimer);
  varselTimer = setTimeout(() => v.classList.add('hidden'), 6000);
}

// Kjører en spillhandling, viser resultatet og oppdaterer siden
async function handling(navn, args) {
  try {
    const r = await rpc(navn, args);
    if (r && r.melding) varsel(r.melding, r.ok ? 'ok' : 'bad');
    await oppdater();
    await visSide(side, true);
    return r;
  } catch (e) {
    if (e instanceof IkkeInnlogget) return tilInnlogging();
    varsel(e.message, 'bad');
    await oppdater().catch(() => {});
  }
}

// ---------------------------------------------------------------- AUTH
let registrer = false;
function settAuthModus(reg) {
  registrer = reg;
  $('#tabLogg').className = reg ? 'ghost' : '';
  $('#tabReg').className = reg ? '' : 'ghost';
  $('#authKnapp').textContent = reg ? 'Opprett bruker' : 'Logg inn';
  $('#authFeil').textContent = '';
}
$('#tabLogg').onclick = () => settAuthModus(false);
$('#tabReg').onclick = () => settAuthModus(true);

$('#authForm').onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const knapp = $('#authKnapp'); knapp.disabled = true;
  $('#authFeil').textContent = '';
  try {
    await post(registrer ? 'registrer' : 'logginn', { epost: f.get('epost'), passord: f.get('passord') });
    e.target.reset();
    await start();
  } catch (err) { $('#authFeil').textContent = err.message; }
  knapp.disabled = false;
};

document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-loggut]')) { await post('loggut').catch(() => {}); tilInnlogging(); }
});

function tilInnlogging() {
  stopp();
  $('#modal').classList.add('hidden');
  vis('auth');
}

$('#lagForm').onsubmit = async (e) => {
  e.preventDefault();
  $('#lagFeil').textContent = '';
  try {
    await rpc('opprett_spiller', { p_navn: new FormData(e.target).get('navn') });
    await start();
  } catch (err) {
    if (err instanceof IkkeInnlogget) return tilInnlogging();
    $('#lagFeil').textContent = err.message;
  }
};

function vis(id) {
  for (const s of ['auth', 'lag', 'spill']) $('#' + s).classList.toggle('hidden', s !== id);
}


let starter = false;
// Google-knapp og feilmelding fra Google-innlogging
fetch('/api/oppsett').then(r => r.json()).then(o => { if (o.google) $('#googleBoks').classList.remove('hidden'); }).catch(() => {});
{
  const feilFraUrl = new URLSearchParams(location.search).get('feil');
  if (feilFraUrl) { $('#authFeil').textContent = feilFraUrl; history.replaceState(null, '', '/'); }
}

async function start() {
  if (starter) return; starter = true;
  try {
    if (!data) data = await rpc('spill_data');
    await oppdater();
    if (!st.spiller) { visLag(); return; }
    vis('spill');
    tegnMeny();
    clearInterval(pollTimer);
    pollTimer = setInterval(() => oppdater().catch((e) => { if (e instanceof IkkeInnlogget) tilInnlogging(); }), 20000);
    await visSide(side);
  } catch (e) {
    if (e instanceof IkkeInnlogget) tilInnlogging();
    else varsel(e.message, 'bad');
  } finally { starter = false; }
}

function stopp() {
  clearInterval(pollTimer);
  clearInterval(chatTimer);
  st = null;
}

// ---------------------------------------------------------------- STATUS
// Prosent fremgang mot neste rank (heltall, 0–100)
function rankProsent() {
  if (!st?.neste_exp) return 100;
  const p = ((st.spiller.exp - st.rank_exp) / (st.neste_exp - st.rank_exp)) * 100;
  return Math.max(0, Math.min(99, Math.floor(p)));
}
let forrigeRank = null;

async function oppdater() {
  st = await rpc('min_status');
  if (st.spiller) {
    if (forrigeRank !== null && st.rank_indeks > forrigeRank) {
      setTimeout(() => varsel(st.rank_indeks >= 9 ? `Du er nå Don – byens høyeste rank!` : `Gratulerer! Du er nå ${st.rank}.`, 'ok'), 1500);
    }
    forrigeRank = st.rank_indeks;
  }
  offset = new Date(st.tid).getTime() - Date.now();
  if (!st.spiller) {
    if (!$('#spill').classList.contains('hidden')) { clearInterval(pollTimer); visLag(); }
    return;
  }
  tegnTopp();
  tegnMeny();
}

function visLag() {
  $('#dodTekst').innerHTML = st.dod
    ? `<p class="bad"><b>${esc(st.dod.navn)}</b> ble drept av <b>${esc(st.dod.drept_av)}</b>. Livet går videre – start på nytt.</p>` : '';
  vis('lag');
}

function vapenNavn(n) { return n ? data.vapen.find(v => v.nivaa === n)?.navn : 'Ingen'; }
function beskNavn(n) { return n ? data.beskyttelse.find(v => v.nivaa === n)?.navn : 'Ingen'; }

function tegnTopp() {
  const s = st.spiller;
  $('#topp').innerHTML = `
    <div class="topp">
      <div class="navn">${esc(s.navn)}</div>
      <div class="pill"><span>Kontant</span><b class="mono gold">${kr(s.penger)}</b></div>
      <div class="pill"><span>Bank</span><b class="mono">${kr(s.bank)}</b></div>
      <div class="pill"><span>Helse</span><b class="mono ${s.helse < 50 ? 'bad' : ''}">${s.helse}%</b></div>
      <div class="pill"><span>By</span>${esc(s.sted)}</div>
      <button class="ghost small loggut" data-loggut>Logg ut</button>
    </div>
    <button class="rankbar" data-side-lenke="ranker" title="Se alle ranker">
      <span class="rb-navn">${esc(st.rank)}</span>
      <span class="rb-spor"><i style="width:${rankProsent()}%"></i></span>
      <span class="rb-pst mono">${st.neste_rank ? rankProsent() + ' %' : 'Maks'}</span>
      <span class="rb-neste">${st.neste_rank ? '→ ' + esc(st.neste_rank) : ''}</span>
    </button>
    <div class="timere">
      <span class="timer" data-til="${s.fengsel_til || ''}" data-navn="Fengsel" data-skjul></span>
      <span class="timer" data-til="${s.krim_klar}" data-navn="Krim"></span>
      <span class="timer" data-til="${s.bil_klar}" data-navn="Bil"></span>
      <span class="timer" data-til="${s.angrep_klar}" data-navn="Angrep"></span>
      <span class="timer" data-til="${s.reise_klar}" data-navn="Reise"></span>
    </div>`;
  tikk();
}

const SIDER = [
  ['oversikt', 'Oversikt'], ['krim', 'Kriminalitet'], ['bil', 'Biltyveri'], ['fengsel', 'Fengsel'],
  ['bank', 'Bank'], ['butikk', 'Butikk'], ['sykehus', 'Sykehus'], ['reise', 'Reise'],
  ['kasino', 'Kasino'], ['angrep', 'Angrep'], ['toppliste', 'Toppliste'], ['ranker', 'Ranker'],
  ['meldinger', 'Meldinger'], ['chat', 'Chat'], ['gravplass', 'Gravplass'],
];
function tegnMeny() {
  $('#meny').innerHTML = SIDER.map(([id, navn]) => {
    let badge = '';
    if (id === 'meldinger' && st?.uleste > 0) badge = `<span class="badge">${st.uleste}</span>`;
    if (id === 'fengsel' && fengslet()) badge = `<span class="badge">!</span>`;
    return `<button data-side="${id}" class="${id === side ? 'aktiv' : ''}">${navn}${badge}</button>`;
  }).join('');
}
$('#meny').onclick = (e) => {
  const b = e.target.closest('[data-side]');
  if (b) { side = b.dataset.side; tegnMeny(); visSide(side); b.scrollIntoView({ inline: 'center', block: 'nearest' }); }
};

// Oppdaterer alle nedtellinger hvert sekund
function tikk() {
  document.querySelectorAll('[data-til]').forEach(el => {
    const s = sekIgjen(el.dataset.til);
    if (el.dataset.navn) {
      if (el.hasAttribute('data-skjul')) el.classList.toggle('hidden', s === 0);
      el.textContent = `${el.dataset.navn}: ${s ? tid(s) : 'klar'}`;
      el.classList.toggle('klar', s === 0);
    } else {
      el.textContent = s ? tid(s) : 'klar';
    }
  });
  document.querySelectorAll('[data-kausjon]').forEach(el => {
    el.textContent = kr(sekIgjen(st?.spiller?.fengsel_til) * 25);
  });
}
setInterval(tikk, 1000);

// ---------------------------------------------------------------- SIDER
async function visSide(id, stille = false) {
  const main = $('#side');
  if (!stille) main.innerHTML = '<p class="dim">Laster …</p>';
  try {
    const html = await SIDE_HTML[id]();
    if (side !== id) return;
    const scroll = window.scrollY;
    main.innerHTML = (fengslet() && id !== 'fengsel'

// Kode som må kjøre etter at en side er tegnet
const ETTER = {
  kasino() {
    $('#rulettForm').onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const knapp = e.target.querySelector('button'); knapp.disabled = true;
      try {
        const r = await rpc('rulett', { p_innsats: Number(f.get('innsats')), p_valg: f.get('valg') });
        const el = $('#rulettRes');
        el.textContent = r.tall;
        el.style.color = r.farge === 'rød' ? 'var(--red2)' : r.farge === 'grønn' ? 'var(--green)' : 'var(--text)';
        varsel(r.melding, r.ok ? 'ok' : 'bad');
        await oppdater();
      } catch (err) { varsel(err.message, 'bad'); }
      knapp.disabled = false;
    };
  },
  async chat() {
    const logg = $('#chatlogg');
    if (!logg) return;
    logg.innerHTML = '';
    sisteChatId = 0;
    await hentChat();
    clearInterval(chatTimer);
    chatTimer = setInterval(() => { if (side === 'chat' && !document.hidden) hentChat(); else clearInterval(chatTimer); }, 4000);
    $('#chatForm').onsubmit = async (e) => {
      e.preventDefault();
      const inp = e.target.tekst;
      try { await rpc('send_chat', { p_tekst: inp.value }); inp.value = ''; await hentChat(); }
      catch (err) { varsel(err.message, 'bad'); }
    };
  },
};

async function hentChat() {
  try {
    const nye = await rpc('chat_siste', { p_etter: sisteChatId });
    for (const m of nye) { leggTilChat(m); sisteChatId = Math.max(sisteChatId, m.id); }
  } catch { /* prøver igjen om litt */ }
}

function leggTilChat(m) {
  const logg = $('#chatlogg');
  if (!logg) return;
  const d = document.createElement('div');
  const t = new Date(m.tid).toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
  d.innerHTML = `<span class="t">${t}</span>${m.navn === 'System'
    ? `<i class="bad">${esc(m.tekst)}</i>`
    : `<b class="gold">${esc(m.navn)}:</b> ${esc(m.tekst)}`}`;
  const nederst = logg.scrollHeight - logg.scrollTop - logg.clientHeight < 40;
  logg.appendChild(d);
  if (nederst || logg.children.length < 70) logg.scrollTop = logg.scrollHeight;
}

// ---------------------------------------------------------------- KLIKK OG SKJEMA
$('#topp').addEventListener('click', (e) => {
  const lenke = e.target.closest('[data-side-lenke]');
  if (lenke) { side = lenke.dataset.sideLenke; tegnMeny(); visSide(side); window.scrollTo({ top: 0 }); }
});

$('#side').addEventListener('click', async (e) => {
  const act = e.target.closest('[data-act]');
  if (act) {
    act.disabled = true;
    await handling(act.dataset.act, act.dataset.args ? JSON.parse(act.dataset.args) : {});
    act.disabled = false;
    return;
  }
  const lenke = e.target.closest('[data-side-lenke]');
  if (lenke) { side = lenke.dataset.sideLenke; tegnMeny(); visSide(side); return; }

  const apne = e.target.closest('[data-apne]');
  if (apne) {
    const id = apne.dataset.apne;
    $('#m' + id).classList.toggle('hidden');
    if (apne.dataset.lest === 'false') {
      apne.dataset.lest = 'true';
      apne.closest('.melding').classList.remove('ulest');
      await rpc('les_melding', { p_id: Number(id) });
      await oppdater();
    }
    return;
  }
  const slett = e.target.closest('[data-slett]');
  if (slett) { await rpc('slett_melding', { p_id: Number(slett.dataset.slett) }); visSide('meldinger', true); return; }

  const svar = e.target.closest('[data-svar]');
  if (svar) {
    const f = $('#skrivForm');
    f.p_til.value = svar.dataset.svar;
    f.p_emne.value = svar.dataset.emne.startsWith('Sv: ') ? svar.dataset.emne : 'Sv: ' + svar.dataset.emne;
    f.p_tekst.focus(); window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
});

$('#side').addEventListener('submit', async (e) => {
  const f = e.target;
  if (!f.dataset.rpc) return;
  e.preventDefault();
  const args = {};
  for (const el of f.querySelectorAll('[name]')) args[el.name] = el.hasAttribute('data-num') ? Number(el.value) : el.value;
  const knapp = f.querySelector('button:not([type=button])'); if (knapp) knapp.disabled = true;
  await handling(f.dataset.rpc, args);
  if (knapp) knapp.disabled = false;
});

  if (p) {
    try {
      const x = await rpc('profil', { p_navn: p.dataset.profil });
      $('#modal').innerHTML = `<div class="card">
        <h2>${esc(x.navn)}</h2>
        <p>${x.online ? '<span class="dot"></span>Pålogget' : '<span class="dim">Ikke pålogget</span>'}</p>
        <div class="grid" style="margin-bottom:12px">
          <div class="stat"><span>Rank</span><b>${esc(x.rank)}</b></div>
          <div class="stat"><span>Drap</span><b>${x.drap}</b></div>
        </div>
        <p class="dim">Startet ${new Date(x.opprettet).toLocaleDateString('nb-NO')}${x.fengsel ? ' · sitter i fengsel' : ''}${x.beskyttet ? ' · ny og beskyttet' : ''}</p>
        <div class="row"><button class="ghost" data-lukk>Lukk</button><button data-skriv="${esc(x.navn)}">Send melding</button></div>
      </div>`;
      $('#modal').classList.remove('hidden');
    } catch (err) { varsel(err.message, 'bad'); }
    return;
  }
  if (e.target.closest('[data-lukk]') || e.target.id === 'modal') { $('#modal').classList.add('hidden'); return; }
  const skriv = e.target.closest('[data-skriv]');
  if (skriv) {
    $('#modal').classList.add('hidden');
    side = 'meldinger'; tegnMeny(); await visSide('meldinger');
    $('#skrivForm').p_til.value = skriv.dataset.skriv;
    $('#skrivForm').p_emne.focus();
  }
});

// Oppstart: prøv å fortsette innlogget økt, ellers vis innlogging
start();
</script>
</body>
</html>
